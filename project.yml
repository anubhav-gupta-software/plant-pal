name: PlantPal
options:
  bundleIdPrefix: com.plantpal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: NO
packages:
  PlantPalKit:
    path: Packages/PlantPalKit
targets:
  PlantPal:
    type: application
    platform: iOS
    sources:
      - path: PlantPal
        excludes:
          - Info.plist
    dependencies:
      - target: PlantPalWidget
        embed: true
      - package: PlantPalKit
        product: PlantPalKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plantpal.app
        INFOPLIST_FILE: PlantPal/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Plant Pal
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ENABLE_PREVIEWS: YES
  PlantPalWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PlantPalWidget
        excludes:
          - Info.plist
    dependencies:
      - package: PlantPalKit
        product: PlantPalKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plantpal.app.widget
        INFOPLIST_FILE: PlantPalWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        INFOPLIST_KEY_CFBundleDisplayName: Plant Pal
schemes:
  PlantPal:
    build:
      targets:
        PlantPal: all
    run:
      config: Debug
